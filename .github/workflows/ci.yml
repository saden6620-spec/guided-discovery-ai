name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.4.0"

      - name: Configure pnpm cache
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"
          cache: pip

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python tooling
        run: python -m pip install pytest==9.1.1 ruff==0.15.22

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate repository
        run: pnpm validate

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build and start development environment
        run: docker compose up --build --detach

      - name: Verify container runtimes
        run: |
          test "$(docker compose exec -T workspace node --version)" = "v24.18.0"
          test "$(docker compose exec -T workspace pnpm --version)" = "11.4.0"
          test "$(docker compose exec -T workspace python --version)" = "Python 3.13.14"

      - name: Stop development environment
        if: always()
        run: docker compose down --remove-orphans
