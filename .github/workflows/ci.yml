name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: memory_service
          POSTGRES_USER: memory_service
          POSTGRES_PASSWORD: memory_service_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memory_service -d memory_service"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://memory_service:memory_service_ci@127.0.0.1:5432/memory_service
      APP_ENV: test
      PERMISSION_TEST_ALLOW: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.4.0"

      - name: Configure pnpm cache
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"
          cache: pip

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python tooling
        run: python -m pip install fastapi==0.141.1 pytest==9.1.1 ruff==0.15.22 uvicorn==0.52.0

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply Memory Service migrations
        run: pnpm --filter @guided-discovery/memory-service migrate:deploy

      - name: Validate repository
        run: pnpm validate

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build and start development environment
        run: docker compose up --build --detach --wait

      - name: Verify container runtimes
        run: |
          test "$(docker compose exec -T workspace node --version)" = "v24.18.0"
          test "$(docker compose exec -T workspace pnpm --version)" = "11.4.0"
          test "$(docker compose exec -T workspace python --version)" = "Python 3.13.14"

      - name: Verify skeleton services
        run: pnpm verify:skeleton

      - name: Stop development environment
        if: always()
        run: docker compose down --remove-orphans
