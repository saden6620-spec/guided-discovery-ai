name: guided-discovery-ai

services:
  workspace:
    build:
      context: .
      dockerfile: docker/development.Dockerfile
      args:
        PNPM_VERSION: "11.4.0"
    command: sleep infinity
    init: true
    volumes:
      - .:/workspace
      - pnpm-store:/pnpm/store
    working_dir: /workspace

volumes:
  pnpm-store:
