[project]
name = "guided-discovery-ai-foundation"
version = "0.0.0"
description = "Python tooling and M1 AI service dependencies."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
cache_dir = ".cache/pytest"
pythonpath = ["ai/orchestrator"]
testpaths = ["tests/python", "ai/orchestrator/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    ".pnpm-store",
    "node_modules",
]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
