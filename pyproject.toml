[project]
name = "guided-discovery-ai-foundation"
version = "0.0.0"
description = "Python quality and test tooling for the repository foundation."
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    ".pnpm-store",
    "node_modules",
]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
