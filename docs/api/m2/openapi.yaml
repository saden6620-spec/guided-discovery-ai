openapi: 3.1.1
info:
  title: Guided Discovery AI M2 Core Backend API
  version: 1.0.0
  description: >-
    Authoritative public M2 HTTP contract under ADR-0001 through ADR-0011.
    Every operation accepts X-Request-ID, traceparent, and optional tracestate;
    the gateway returns the effective X-Request-ID. Cross-field and lifecycle
    rules are identified in validation-specification.md and are contract-tested.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Memory
  - name: Planning
  - name: Navigation
  - name: Recommendations
  - name: Documentation
  - name: Notifications
  - name: Search
paths:
  /memories:
    parameters: &standardRequestHeaders
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/Tracestate"
    get:
      summary: List memories
      tags: [Memory]
      operationId: listMemories
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: categoryId
          in: query
          schema: { $ref: "#/components/schemas/ResourceId" }
        - name: sort
          in: query
          schema: { type: string, const: createdAt, default: createdAt }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Owner-visible memories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a memory
      tags: [Memory]
      operationId: createMemory
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMemoryRequest" }
      responses:
        "201":
          description: Memory created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /memories/{id}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/Tracestate"
      - $ref: "#/components/parameters/ResourceIdPath"
    get:
      summary: Get a memory
      tags: [Memory]
      operationId: getMemory
      responses:
        "200":
          description: Memory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    patch:
      summary: Update a memory
      tags: [Memory]
      operationId: updateMemory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMemoryRequest" }
      responses:
        "200":
          description: Memory updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a memory
      tags: [Memory]
      operationId: deleteMemory
      responses:
        "204": { description: Memory immediately removed from normal behavior }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /plans:
    parameters: *standardRequestHeaders
    get:
      summary: List plans
      tags: [Planning]
      operationId: listPlans
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PlanStatus" }
        - name: startDateFrom
          in: query
          schema: { type: string, format: date }
        - name: startDateTo
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a plan
      tags: [Planning]
      operationId: createPlan
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
