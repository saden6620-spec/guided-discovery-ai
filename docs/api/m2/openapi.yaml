      operationId: getNavigationStatus
      parameters:
        - name: sessionId
          in: query
          schema: { $ref: "#/components/schemas/ResourceId" }
      responses:
        "200":
          description: Navigation status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NavigationResponse" }
